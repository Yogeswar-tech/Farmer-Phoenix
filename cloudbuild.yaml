steps:
  # Step 1: Build Docker image with Firebase config baked in
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - --platform=linux/amd64
      - --build-arg=VITE_FIREBASE_API_KEY=AIzaSyD1Jw46rpGDOckqBh2sGqePmYHXvJZFL2s
      - --build-arg=VITE_FIREBASE_AUTH_DOMAIN=kisansetu-dev.firebaseapp.com
      - --build-arg=VITE_FIREBASE_PROJECT_ID=kisansetu-dev
      - --build-arg=VITE_FIREBASE_STORAGE_BUCKET=kisansetu-dev.firebasestorage.app
      - --build-arg=VITE_FIREBASE_MESSAGING_SENDER_ID=66226476599
      - --build-arg=VITE_FIREBASE_APP_ID=1:66226476599:web:7efe71ca2f83c32818d1b2
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/kisan-sethu/app:$COMMIT_SHA
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/kisan-sethu/app:latest
      - .

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/kisan-sethu/app:$COMMIT_SHA

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/kisan-sethu/app:latest

  # Step 3: Deploy new revision to Cloud Run (asia-south1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - kisan-sethu
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/kisan-sethu/app:$COMMIT_SHA
      - --region=asia-south1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=KS_ENV=production
      - --update-env-vars=KS_GCP_LOCATION=asia-south1

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/kisan-sethu/app:$COMMIT_SHA
  - asia-south1-docker.pkg.dev/$PROJECT_ID/kisan-sethu/app:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
