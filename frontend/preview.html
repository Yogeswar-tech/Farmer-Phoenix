<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>किसान सेतु (Kisan Setu) - लाइव प्रीव्यू</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; }
    .preview-header {
      background: #1e293b;
      color: #f8fafc;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
    }
    .preview-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
    .badge { background: #22c55e; color: #022c22; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    .direct-link {
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .direct-link:hover { background: #1d4ed8; }
    iframe { width: 100%; height: calc(100% - 48px); border: none; background: #ffffff; }
  </style>
</head>
<body>
  <div class="preview-header">
    <div class="preview-brand">
      <span>🌾 किसान सेतु (Kisan Setu) React Frontend</span>
      <span class="badge">● LIVE DEV SERVER</span>
    </div>
    <a href="http://localhost:3000" target="_blank" class="direct-link">🌐 Open in New Tab (http://localhost:3000)</a>
  </div>
  <iframe src="http://localhost:3000" title="Kisan Setu Live Preview"></iframe>
</body>
</html>
