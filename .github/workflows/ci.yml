name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Lint, TypeCheck, Tests & Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          uv sync --dev

      - name: Run Ruff Linting
        working-directory: backend
        run: |
          uv run ruff check app

      - name: Run Mypy Strict Type Check
        working-directory: backend
        run: |
          uv run mypy app

      - name: Run Pytest Test Suite
        working-directory: backend
        run: |
          uv run pytest

      - name: Run Crop Doctor 150-Case Golden Evaluation Harness
        working-directory: backend
        run: |
          uv run python evals/run_evals.py

  frontend-checks:
    name: Frontend TypeCheck, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps

      - name: Run TypeScript Compile Check
        working-directory: frontend
        run: |
          npx tsc -p tsconfig.app.json --noEmit

      - name: Run Frontend Tests
        working-directory: frontend
        run: |
          npm test

      - name: Build Production Frontend Bundle
        working-directory: frontend
        run: |
          npm run build
